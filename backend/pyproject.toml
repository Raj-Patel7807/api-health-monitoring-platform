[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-health-monitor-backend"
version = "0.1.0"
description = "Backend foundation for the API health monitoring dashboard."
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.14,<2",
    "celery>=5.4,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "aiosmtplib>=2.0,<3",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
    "cryptography>=50.0.2",
    "httpx2>=2.13.1",
    "python-jose[cryptography]>=3.3,<4",
    "bcrypt>=4.0,<6",
    "asyncpg>=0.29,<1",
    "email-validator",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"database/verify_schema.py" = ["E501"]
"app/api/*.py" = ["B008"]
"app/models/delivery.py" = ["UP042"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jose", "jose.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bcrypt"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["passlib", "passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "celery*"]
exclude = ["tests*"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "ruff>=0.17.3",
]



