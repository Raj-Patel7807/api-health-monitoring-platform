name: Bug report
description: Report a reproducible product problem.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What happened and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: requirement
    attributes: { label: Related requirement or story ID }
